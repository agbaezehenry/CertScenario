name: ci

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - run: .venv/bin/ruff check backend tests
      - run: .venv/bin/pytest -q -m "not integration and not characters"
      - run: .venv/bin/python -m app.cli milestone --provider mock

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Spec §30 / §40.2: the grading loop must be proven on the REAL provider.
  # A mock that drifts from FRR produces confident false passes.
  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: install containerlab
        run: bash -c "$(curl -sL https://get.containerlab.dev)"
      - name: pull images
        run: docker pull quay.io/frrouting/frr:10.2.1 && docker pull alpine:3.20
      - name: milestone on real FRR
        run: sudo -E env PATH="$PATH" LAB_PROVIDER=containerlab .venv/bin/python -m app.cli milestone
      - name: integration suite
        run: sudo -E env PATH="$PATH" LAB_PROVIDER=containerlab .venv/bin/pytest -q -m integration tests/integration
      - name: no leaked labs
        if: always()
        run: sudo -E env PATH="$PATH" LAB_PROVIDER=containerlab .venv/bin/python -m app.cli cleanup-labs

  # Spec §40.3: zero leaks required to ship. Runs the leak gate when an LLM key
  # is configured (secrets cannot gate a job directly, so the check is a step).
  characters:
    runs-on: ubuntu-latest
    needs: unit
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
    steps:
      - id: key
        run: |
          if [ -n "$LLM_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "LLM_API_KEY not set; leak gate skipped"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: astral-sh/setup-uv@v3
        if: steps.key.outputs.present == 'true'
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -e ".[dev]"
        if: steps.key.outputs.present == 'true'
      - run: .venv/bin/pytest -q -m characters tests/characters
        if: steps.key.outputs.present == 'true'
