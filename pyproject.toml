[project]
name = "northstar"
version = "0.1.0"
description = "Northstar Technologies — AI-powered network engineer simulation platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "websockets>=12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
northstar = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]
markers = [
    "integration: requires the real containerlab provider (docker + containerlab)",
    "characters: LLM-backed character leak tests (release gate)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"backend/app/api/*" = ["B008"]   # FastAPI Depends()/Query() in defaults is the framework idiom

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
